appId: com.screensplitter.app
productName: Screen Splitter
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - resources/**
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  createDesktopShortcut: true
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: resources/icon.png
  category: public.app-category.utilities
  # No Developer ID: ad-hoc sign so Apple Silicon runs it; not notarized
  identity: "-"
  hardenedRuntime: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
